name: page_animation_transition
description: >-
  A Flutter package providing 15 pre-built animated page transitions including
  slide, fade, scale, flip, size, and platform-adaptive variants. Supports
  custom duration and easing curves.
version: 0.1.0
repository: https://github.com/aayushkedawat/page_animation_transition
issue_tracker: https://github.com/aayushkedawat/page_animation_transition/issues

environment:
  sdk: ">=2.12.1 <3.0.0"
  flutter: ">=1.17.0"

topics:
  - animation
  - navigation
  - transition
  - flutter

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
